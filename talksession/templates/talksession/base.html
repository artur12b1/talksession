{% load static %}
<!DOCTYPE html>
<html name="viewport" content="width=device-width, initial-scale=1.0"><html lang="pl">
    <title>{% block title %}TalkSession{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    {% block content %}{% endblock %}

    {% if request.user.is_authenticated %}
        <div id="notificationToast" class="notification-toast" style="display: none;">
            <div class="notification-title">Nowa wiadomość</div>
            <div id="notificationText" class="notification-text"></div>
        </div>

        <script>
            const presenceProtocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';

            const presenceSocket = new WebSocket(
                presenceProtocol + window.location.host + '/ws/presence/'
            );

            presenceSocket.onmessage = function(event) {
                const data = JSON.parse(event.data);

                document.querySelectorAll('[data-status-dot-user-id="' + data.user_id + '"]').forEach(function(dot) {
                    dot.classList.remove('online', 'offline');
                    dot.classList.add(data.is_online ? 'online' : 'offline');
                });

                document.querySelectorAll('[data-status-label-user-id="' + data.user_id + '"]').forEach(function(label) {
                    label.textContent = data.is_online ? 'Online' : 'Offline';
                });
            };

            const notificationProtocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';

            const notificationSocket = new WebSocket(
                notificationProtocol + window.location.host + '/ws/notifications/'
            );

            notificationSocket.onmessage = function(event) {
                const data = JSON.parse(event.data);

                if (data.type !== 'new_message') {
                    return;
                }

                const currentPath = window.location.pathname;
                const targetRoomPath = '/room/' + data.room_id + '/';

                if (currentPath === targetRoomPath) {
                    return;
                }

                const toast = document.getElementById('notificationToast');
                const text = document.getElementById('notificationText');

                if (!toast || !text) {
                    return;
                }

                text.textContent = data.sender + ' w ' + data.room_name + ': ' + data.preview;

                toast.style.display = 'block';
                document.title = '🔔 Nowa wiadomość';

                toast.onclick = function() {
                    window.location.href = targetRoomPath;
                };

                setTimeout(function() {
                    toast.style.display = 'none';
                    document.title = 'TalkSession';
                }, 5000);
            };
        </script>
    {% endif %}
</body>
</html>
<head>
    <meta charset="UTF-8">
